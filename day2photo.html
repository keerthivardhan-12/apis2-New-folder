<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #82c8e3;
            color: #555;
        }

        /* Main container */
        .container {
            width: 900px;
            margin: 50px auto;
        }

        /* Profile section */
        .profile {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f5d76e;
        }

        .profile-info {
            margin-left: 45px;
        }

        .profile-info h1 {
            margin: 0 0 10px;
            font-size: 32px;
            color: #555;
        }

        .profile-info p {
            margin: 0;
            font-size: 17px;
            max-width: 650px;
        }

        /* Education cards */
        .education {
            display: flex;
            justify-content: space-between;
            gap: 28px;
        }

        .card {
            width: 280px;
            height: 230px;
            background-color: #eb7fa7;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 125px;
            object-fit: cover;
            border-radius: 12px;
        }

        .card h2 {
            font-size: 19px;
            margin: 12px 0 2px;
            color: #555;
        }

        .card a {
            color: #6b3b63;
            font-size: 15px;
        }

        /* Achievements */
        .achievements {
            width: 240px;
            background-color: #8ed17d;
            border-radius: 14px;
            margin: 35px auto 0;
            padding: 20px;
        }

        .achievements h2 {
            text-align: center;
            margin: 0 0 15px;
            font-size: 22px;
        }

        .achievements ul {
            padding-left: 25px;
            margin: 0;
        }

        .achievements li {
            margin: 8px 0;
        }
    </style>
</head>
